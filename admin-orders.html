<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commandes | NUBI Bar Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .admin-bg { background: linear-gradient(145deg, #050505 0%, #0d0714 45%, #050505 100%); }
        .glass { background: rgba(255, 255, 255, 0.045); backdrop-filter: blur(16px); }
        .panel { background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.032)); box-shadow: 0 24px 70px rgba(0,0,0,.34); }
        .metric-card { background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.08); }
        @keyframes pulse-ring { 0%, 100% { box-shadow: 0 0 0 0 rgba(234,179,8,0.34); } 50% { box-shadow: 0 0 0 8px rgba(234,179,8,0); } }
        .new-order { animation: pulse-ring 1.5s ease infinite; }
    </style>
</head>
<body class="admin-bg text-gray-300 min-h-screen">

    <div class="fixed top-6 right-6 z-[120]">
        <button id="lang-toggle" class="bg-black/50 backdrop-blur-md border border-purple-500/30 px-4 py-2 rounded-full text-xs font-bold tracking-widest hover:border-purple-500 transition-all flex items-center gap-2">
            <span id="lang-text">EN</span>
            <i data-lucide="languages" class="w-4 h-4 text-purple-400"></i>
        </button>
    </div>

    <div id="auth-container" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#050505]">
        <div class="w-full max-w-md p-8 rounded-3xl border border-white/10 glass">
            <h1 class="text-4xl font-serif text-white mb-8 text-center">NUBI <span class="text-purple-500">Admin</span></h1>
            <form id="login-form" class="space-y-6">
                <div>
                    <label data-i18n="email_label" class="block text-xs uppercase tracking-widest text-gray-500 mb-2 font-bold">Adresse e-mail</label>
                    <input type="email" id="email" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-all">
                </div>
                <div>
                    <label data-i18n="password_label" class="block text-xs uppercase tracking-widest text-gray-500 mb-2 font-bold">Mot de passe</label>
                    <input type="password" id="password" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-all">
                </div>
                <button type="submit" data-i18n="login_btn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl transition-all">CONNEXION</button>
                <div id="login-error" class="text-red-400 text-sm text-center hidden"></div>
            </form>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen">
        <aside class="fixed left-0 top-0 h-full w-64 border-r border-white/8 bg-black/35 backdrop-blur-xl z-40 hidden md:block">
            <div class="p-8 space-y-4">
                <h2 class="text-xl font-serif text-white mb-8 tracking-widest">NUBI <span class="text-purple-400">BAR</span></h2>
                <a href="/admin.html" class="flex items-center gap-3 text-gray-500 hover:text-white hover:bg-white/5 rounded-xl px-3 py-3 transition-colors text-xs font-bold uppercase tracking-widest">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> <span data-i18n="back_to_menu">Retour au menu</span>
                </a>
                <a href="/admin-tables.html" class="flex items-center gap-3 text-gray-500 hover:text-white hover:bg-white/5 rounded-xl px-3 py-3 transition-colors text-xs font-bold uppercase tracking-widest">
                    <i data-lucide="qr-code" class="w-4 h-4"></i> <span data-i18n="manage_tables">Gérer les tables</span>
                </a>
            </div>
            <div class="absolute bottom-8 left-8 right-8">
                <button id="logout-btn" class="flex items-center gap-3 text-gray-500 hover:text-white transition-colors text-xs font-bold uppercase tracking-widest">
                    <i data-lucide="log-out" class="w-4 h-4"></i> <span data-i18n="sign_out">Déconnexion</span>
                </button>
            </div>
        </aside>

        <main class="md:ml-64 p-4 md:p-10 xl:p-12">
            <header class="panel border border-white/10 rounded-[1.75rem] p-5 md:p-8 mb-8">
                <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-6">
                <div>
                    <div class="inline-flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 rounded-full px-3 py-1 mb-4">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        <span data-i18n="live_badge">Service en direct</span>
                    </div>
                    <h1 class="text-4xl md:text-5xl font-serif text-white" data-i18n="orders_title">Commandes</h1>
                    <p class="text-sm text-gray-400 mt-2 max-w-xl" data-i18n="orders_subtitle">Gérez les commandes en temps réel.</p>
                </div>
                <div id="orders-count" class="flex items-center gap-2 bg-purple-600/15 border border-purple-500/30 px-4 py-2 rounded-full text-purple-200 text-xs font-bold uppercase tracking-widest self-start">
                    <i data-lucide="activity" class="w-4 h-4 text-purple-300"></i>
                    <span id="pending-count">0</span> <span data-i18n="pending">en attente</span>
                </div>
                </div>
                <div class="grid grid-cols-2 xl:grid-cols-4 gap-3 mt-7">
                    <div class="metric-card rounded-2xl p-4">
                        <p class="text-[10px] uppercase tracking-widest text-gray-500 font-bold" data-i18n="orders_active_metric">Commandes actives</p>
                        <p id="metric-active-orders" class="text-2xl font-semibold text-white mt-2">0</p>
                    </div>
                    <div class="metric-card rounded-2xl p-4">
                        <p class="text-[10px] uppercase tracking-widest text-gray-500 font-bold" data-i18n="new_orders_metric">Nouvelles</p>
                        <p id="metric-new-orders" class="text-2xl font-semibold text-yellow-300 mt-2">0</p>
                    </div>
                    <div class="metric-card rounded-2xl p-4">
                        <p class="text-[10px] uppercase tracking-widest text-gray-500 font-bold" data-i18n="ready_orders_metric">Prêtes</p>
                        <p id="metric-ready-orders" class="text-2xl font-semibold text-emerald-300 mt-2">0</p>
                    </div>
                    <div class="metric-card rounded-2xl p-4">
                        <p class="text-[10px] uppercase tracking-widest text-gray-500 font-bold" data-i18n="tables_metric">Tables ouvertes</p>
                        <p id="metric-open-tables" class="text-2xl font-semibold text-purple-200 mt-2">0</p>
                    </div>
                </div>
            </header>

            <div id="orders-list" class="grid grid-cols-1 xl:grid-cols-2 gap-6"></div>
            <p id="orders-empty" class="hidden text-center text-gray-500 py-16 border border-white/10 rounded-3xl bg-white/[0.03]" data-i18n="no_orders">Aucune commande active.</p>
        </main>
    </div>

    <!-- Time estimate modal -->
    <div id="time-modal" class="hidden fixed inset-0 z-[110] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-[#0a0a0a] border border-white/10 rounded-2xl p-6 max-w-sm w-full">
            <h3 class="text-lg font-serif text-white mb-4" data-i18n="set_time">Temps estimé (minutes)</h3>
            <input type="number" id="estimated-minutes" min="1" max="120" value="15" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white mb-4 focus:border-purple-500 outline-none">
            <div class="flex gap-3">
                <button id="time-cancel" type="button" class="flex-1 py-3 border border-white/10 rounded-xl text-xs font-bold uppercase" data-i18n="cancel">Annuler</button>
                <button id="time-confirm" type="button" class="flex-1 py-3 bg-purple-600 text-white rounded-xl text-xs font-bold uppercase" data-i18n="confirm">Confirmer</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin-orders.js"></script>
</body>
</html>
