<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Codes — Tables | NUBI Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .admin-bg { background: linear-gradient(145deg, #050505 0%, #0d0714 45%, #050505 100%); }
        .glass { background: rgba(255, 255, 255, 0.045); backdrop-filter: blur(16px); }
        .panel { background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.032)); box-shadow: 0 24px 70px rgba(0,0,0,.34); }
        .metric-card { background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.08); }
    </style>
</head>
<body class="admin-bg text-gray-300 min-h-screen">

    <div class="fixed top-6 right-6 z-[120]">
        <button id="lang-toggle" class="bg-black/50 backdrop-blur-md border border-purple-500/30 px-4 py-2 rounded-full text-xs font-bold tracking-widest hover:border-purple-500 transition-all flex items-center gap-2">
            <span id="lang-text">EN</span>
            <i data-lucide="languages" class="w-4 h-4 text-purple-400"></i>
        </button>
    </div>

    <div id="auth-container" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#050505] transition-opacity duration-500">
        <div class="w-full max-w-md p-8 rounded-3xl border border-white/10 glass">
            <h1 class="text-4xl font-serif text-white mb-8 text-center">NUBI <span class="text-purple-500">Admin</span></h1>
            <form id="login-form" class="space-y-6">
                <div>
                    <label data-i18n="email_label" class="block text-xs uppercase tracking-widest text-gray-500 mb-2 font-bold">Adresse e-mail</label>
                    <input type="email" id="email" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-all">
                </div>
                <div>
                    <label data-i18n="password_label" class="block text-xs uppercase tracking-widest text-gray-500 mb-2 font-bold">Mot de passe</label>
                    <input type="password" id="password" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-all">
                </div>
                <button type="submit" data-i18n="login_btn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-purple-900/20 transition-all">
                    CONNEXION
                </button>
                <div id="login-error" class="text-red-400 text-sm text-center hidden"></div>
            </form>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen">
        <aside class="fixed left-0 top-0 h-full w-64 border-r border-white/8 bg-black/35 backdrop-blur-xl z-40 hidden md:block">
            <div class="p-8">
                <h2 class="text-xl font-serif text-white mb-10 tracking-widest">NUBI <span class="text-purple-400">BAR</span></h2>
                <a href="/admin.html" class="flex items-center gap-3 text-gray-500 hover:text-white hover:bg-white/5 rounded-xl px-3 py-3 transition-colors text-xs font-bold uppercase tracking-widest">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span data-i18n="back_to_menu">Retour au menu</span>
                </a>
                <a href="/admin-orders.html" class="flex items-center gap-3 text-gray-500 hover:text-white hover:bg-white/5 rounded-xl px-3 py-3 transition-colors text-xs font-bold uppercase tracking-widest mt-2">
                    <i data-lucide="clipboard-list" class="w-4 h-4"></i>
                    <span data-i18n="manage_orders">Commandes</span>
                </a>
            </div>
            <div class="absolute bottom-8 left-8 right-8">
                <button id="logout-btn" class="flex items-center gap-3 text-gray-500 hover:text-white transition-colors text-xs font-bold uppercase tracking-widest">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span data-i18n="sign_out">Déconnexion</span>
                </button>
            </div>
        </aside>

        <main class="md:ml-64 p-4 md:p-10 xl:p-12">
            <header class="panel border border-white/10 rounded-[1.75rem] p-5 md:p-8 mb-8">
                <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-6">
                    <div>
                        <div class="inline-flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-purple-200 bg-purple-500/10 border border-purple-500/20 rounded-full px-3 py-1 mb-4">
                            <i data-lucide="qr-code" class="w-3.5 h-3.5"></i>
                            <span>QR Tables</span>
                        </div>
                        <h1 class="text-4xl md:text-5xl font-serif text-white" data-i18n="tables_title">Gestion des tables</h1>
                        <p class="text-sm text-gray-400 mt-2 max-w-xl" data-i18n="tables_subtitle">Générez et téléchargez les QR codes pour chaque table.</p>
                    </div>
                    <button id="add-table-btn" class="bg-purple-600 text-white hover:bg-purple-500 px-5 py-3 rounded-2xl text-xs font-bold tracking-widest transition-all flex items-center gap-2 self-start shadow-lg shadow-purple-950/30">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span data-i18n="add_table">AJOUTER UNE TABLE</span>
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_220px] gap-4 mt-7">
                    <div class="relative">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                    <input
                        type="search"
                        id="table-search"
                        data-i18n-placeholder="search_table"
                        placeholder="Rechercher une table…"
                        class="w-full bg-black/35 border border-white/10 rounded-2xl pl-11 pr-4 py-3.5 text-white text-sm focus:outline-none focus:border-purple-500 transition-all"
                    >
                    </div>
                    <div class="metric-card rounded-2xl px-4 py-3 flex items-center justify-between">
                        <span class="text-[10px] uppercase tracking-widest text-gray-500 font-bold" data-i18n="tables_metric">Tables ouvertes</span>
                        <span id="tables-count" class="text-2xl font-semibold text-purple-200">0</span>
                    </div>
                </div>
            </header>

            <div id="tables-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-5">
            </div>

            <p id="tables-empty" class="hidden text-center text-gray-500 text-sm py-16" data-i18n="no_tables">Aucune table pour le moment.</p>
            <p id="tables-no-match" class="hidden text-center text-gray-500 text-sm py-16" data-i18n="no_tables_match">Aucune table ne correspond à votre recherche.</p>
        </main>
    </div>

    <script type="module" src="admin-tables.js"></script>
</body>
</html>
